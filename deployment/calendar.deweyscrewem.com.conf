server {
  listen 80;
  listen [::]:80;
  server_name calendar.deweyscrewem.com;
  location ^~ /.well-known/acme-challenge/ { root /var/lib/feracal-acme; }
  location / { return 301 https://calendar.deweyscrewem.com$request_uri; }
}
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name calendar.deweyscrewem.com;
  ssl_certificate /etc/letsencrypt/live/calendar.deweyscrewem.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/calendar.deweyscrewem.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 2m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location / {
    proxy_pass http://127.0.0.1:4179;
    proxy_set_header Host calendar.deweyscrewem.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host "";
    proxy_read_timeout 40s;
    proxy_connect_timeout 5s;
    proxy_hide_header X-Powered-By;
  }
}
